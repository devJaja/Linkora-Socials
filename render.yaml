services:
  - type: web
    name: linkora-socials-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: linkora-socials-backend
    buildCommand: pnpm install --frozen-lockfile && cd apps/backend && pnpm run build
    startCommand: cd apps/backend && pnpm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://linkora-socials.onrender.com
      - key: PORT
        value: 3000
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ENCRYPTION_KEY
        sync: false
      - key: BACKEND_SECRET
        sync: false
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_FRIENDBOT_URL
        value: https://friendbot.stellar.org
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: GMAIL_USER
        value: linkora56@gmail.com
      - key: GMAIL_FROM
        value: "Linkora <linkora56@gmail.com>"
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false